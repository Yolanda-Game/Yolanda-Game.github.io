<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yolanda · 游戏设计师</title>
<!-- 字体预加载：一拿到 HTML 就开始下 woff2，不再等 JS 渲染完才发起 -->
<link rel="preload" href="fonts/SourceHanSansSC-VF.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/SourceHanSerifSC-VF.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/markdown.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="bg">
  <div class="grid"></div><div class="ticks"></div><div class="spot"></div><div class="vig"></div>
</div>
<div class="glow"></div>
<div class="grain"></div>
<div class="cursor-plus" id="cross"></div>

<div id="brand">
  <span class="brand-txt" id="brandTxt">YOLANDA</span>
  <span class="brand-role">GAME DESIGNER</span>
</div>

<div id="minimap">
  <div class="mm-grid" id="mmGrid"></div>
  <div class="mm-name" id="mmName">首页</div>
</div>

<!-- ============ 联系我层（全屏；三个关于实例共用，放 #world 外面） ============ -->
<div class="ab-layer" id="abLayer">
  <div class="dl-page">
    <div class="dl-head">
      <div class="dl-lock">
        <h3 class="dl-ttl">联系我</h3>
        <div class="dl-en">CONTACT ME</div>
      </div>
      <div class="dl-meta"><button class="dl-share" id="abClose">关闭 ✕（Esc）</button></div>
    </div>
    <div class="dl-split">
      <div class="contact"></div>
      <div class="dl-pcol">
        <div class="post" id="abCV"></div>
      </div>
    </div>
  </div>
</div>

<!-- ============ 项目详情层（全屏；跟联系我层同级，放 #world 外面） ============ -->
<div class="pj-layer" id="pjLayer">
  <div class="dl-page">
    <div class="pj-lhead">
      <div class="dl-meta">项目详情</div>
      <div class="pj-lhead-act">
        <button class="lg-sw" id="mLang" aria-label="中英切换">
          <span class="cn">中</span><span class="en">EN</span>
        </button>
        <button class="dl-share" id="mClose">关闭 ✕（Esc）</button>
      </div>
    </div>

    <div class="pj-fhead">
      <div class="pj-fl">
        <div class="pj-fmeta"><span id="mDate"></span></div>
        <h2 class="pj-ttl" id="mName"></h2>
        <div class="pj-ttl-en" id="mNameEn"></div>
      </div>
      <div class="pj-fr">
        <span id="mRole"></span>
        <span id="mSpec"></span>
      </div>
    </div>

    <div class="pj-col" id="pjCol">
      <div class="pj-body">
        <div class="pj-text">
          <div class="post" id="mIntro"></div>
        </div>

        <div class="pj-side" id="mSide">
          <div class="shots">
            <div class="shot-box" id="mShotBox"></div>
            <div class="shot-bar">
              <span class="shot-note" id="mShotNote"></span>
              <span id="mShotIdx"></span>
              <button class="pn" id="sPrev" aria-label="上一张">‹</button>
              <button class="pn" id="sNext" aria-label="下一张">›</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ============ 全图层（项目页 / 作品页共用；点详情层里的大图打开） ============ -->
<div class="light-layer" id="lightLayer">
  <div class="dl-page">
    <div class="pj-lhead">
      <div class="dl-meta">全图<span class="dot">·</span><span id="lightName"></span></div>
      <button class="dl-share" id="lightClose">关闭 ✕（Esc）</button>
    </div>
    <div class="light-box" id="lightBox"></div>
    <div class="shot-bar">
      <span class="shot-note" id="lightNote"></span>
      <span id="lightIdx"></span>
      <button class="pn" id="lightPrev" aria-label="上一张">‹</button>
      <button class="pn" id="lightNext" aria-label="下一张">›</button>
    </div>
  </div>
</div>

<!-- ============ 作品详情层（跟项目页同一套模板） ============ -->
<div class="pj-layer" id="wkLayer">
  <div class="dl-page">
    <div class="pj-lhead">
      <div class="dl-meta">作品详情</div>
      <div class="pj-lhead-act">
        <button class="lg-sw" id="wLang" aria-label="中英切换">
          <span class="cn">中</span><span class="en">EN</span>
        </button>
        <button class="dl-share" id="wClose">关闭 ✕（Esc）</button>
      </div>
    </div>

    <div class="pj-fhead">
      <div class="pj-fl">
        <div class="pj-fmeta"><span id="wDate"></span><span class="sep" id="wSep">·</span><span id="wTags"></span></div>
        <h2 class="pj-ttl" id="wName"></h2>
        <div class="pj-ttl-en" id="wNameEn"></div>
      </div>
      <div class="pj-fr">
        <span id="wSpec"></span>
        <span id="wProj"></span>
      </div>
    </div>

    <div class="pj-col" id="wCol">
      <div class="pj-body">
        <div class="pj-text">
          <div class="post" id="wIntro"></div>
        </div>

        <div class="pj-side" id="wSide">
          <div class="shots">
            <div class="shot-box" id="wShotBox"></div>
            <div class="shot-bar">
              <span class="shot-note" id="wShotNote"></span>
              <span id="wShotIdx"></span>
              <button class="pn" id="wPrev" aria-label="上一张">‹</button>
              <button class="pn" id="wNext" aria-label="下一张">›</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="viewport">
  <div id="world">

    <!-- ── 首页 ── -->

      </div>
      <div class="plan-veil"></div>

      <div class="hero">
        <div class="kicker">
          <span class="cn">游戏设计师</span>
          <span class="en">GAME DESIGNER</span>
          <span class="scope">关卡 · 任务 · 系统 · UE · Unity</span>
        </div>
        <img class="sig-img" src="images/signature-white.png" alt=""
             onerror="this.classList.add('missing');document.getElementById('sigFallback').classList.add('show')">
        <div class="sig-fallback" id="sigFallback">YOLANDA</div>
        <div class="hero-cap">
          <span class="cn">作品集</span>
          <span class="en">PORTFOLIO · <span id="year">2026</span></span>
        </div>
      </div>
    </section>

    <!-- ── 项目（轮播 + 目录） ── -->
    <section class="proj" id="projSec" data-c="1" data-r="0">
      <div class="pj-bg">
        <img id="bgA" alt=""><img id="bgB" alt="">
        <div class="pj-shade"></div>
        <div class="pj-grid"></div>
      </div>

      <div class="dl-page">
        <div class="dl-head">
          <div class="dl-lock">
            <h3 class="dl-ttl">项目</h3>
            <div class="dl-en">PROJECTS</div>
          </div>
          <div class="pj-pager edge-safe">
            <button class="pn" id="pPrev" aria-label="上一屏">‹</button>
            <span class="pj-count" id="pIdx">01 / 04</span>
            <button class="pn" id="pNext" aria-label="下一屏">›</button>
          </div>
          <div class="pj-prog"><i id="prog"></i></div>
        </div>

        <div class="pj-hero">
          <div class="pj-txt">
            <h1 class="pj-name" id="pName"></h1>
            <div class="pj-name-en" id="pNameEn"></div>
            <div class="pj-date" id="pDate"></div>
            <div class="pj-spec" id="pSpec"></div>
            <div class="pj-spec-en" id="pSpecEn"></div>
            <div class="pj-index" id="pIndex"></div>
            <div class="pj-act">
              <button class="ab-btn" id="pOpen">查看项目<span>VIEW PROJECT</span></button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ── 作品（标签筛选 + 网格 + 分页） ── -->
    <section class="works" id="wkSec" data-c="2" data-r="0">
      <div class="dl-page">
        <div class="dl-head">
          <div class="dl-lock">
            <h3 class="dl-ttl">作品</h3>
            <div class="dl-en">WORKS</div>
          </div>
          <div class="dl-meta"><span id="wCount"></span></div>
        </div>

        <div class="wk-floor" id="wFloor"></div>
        <div class="wk-grid" id="wGrid"></div>

        <div class="wk-pager edge-safe">
          <button id="wPgPrev" aria-label="上一页">‹</button>
          <span class="num" id="wPgIdx">01 / 01</span>
          <button id="wPgNext" aria-label="下一页">›</button>
        </div>
      </div>
    </section>

    <!-- ── 开发日志（模板，JS 复制到三列） ── -->
    <section class="devlog" data-tpl="blog" data-c="0" data-r="-1">
      <div class="dl-page">
        <div class="dl-head">
          <div class="dl-lock">
            <h3 class="dl-ttl">开发日志</h3>
            <div class="dl-en">DEV BLOG</div>
          </div>
          <div class="dl-meta"><span class="dlCount"></span><span class="dot">·</span><span class="dlLast"></span></div>
        </div>
        <div class="dl-floor"></div>
        <div class="dl-split">
          <aside class="dl-idx"></aside>
          <div class="dl-pwrap">
            <div class="dl-phead">
              <div class="dl-pmeta">
                <span class="dlDate"></span><span class="sep">·</span><span class="dlTag"></span>
                <span class="sep">·</span><button class="dl-share">复制链接</button>
                <button class="lg-sw" data-lang-sw aria-label="中英切换"><span class="cn">中</span><span class="en">EN</span></button>
              </div>
              <h3 class="dl-pttl"></h3>
            </div>
            <div class="dl-pbody">
              <div class="dl-pcol"><div class="post dl-body"></div></div>
            </div>
          </div>
        </div>
      </div>
    </section>

        <!-- ── 关于（模板，JS 复制到三列） ── -->
    <section class="about" data-tpl="about" data-c="0" data-r="1">
      <div class="dl-page">
        <div class="dl-head">
          <div class="dl-lock">
            <h3 class="dl-ttl">关于我</h3>
            <div class="dl-en">ABOUT ME</div>
          </div>
          <div class="dl-meta">
            <span class="abNProj"></span><span class="dot">·</span>
            <span class="abNWork"></span><span class="dot">·</span>
            <span class="abNLog"></span>
          </div>
        </div>

        <div class="ab-body"></div>
      </div>
    </section>

  </div>
</div>

<div class="edge top"    id="eTop"></div>
<div class="edge bottom" id="eBottom"></div>
<div class="edge left"   id="eLeft"></div>
<div class="edge right"  id="eRight"></div>

<!-- ============ 日志容器：内容改由 data/logs.js 加载 ============ -->

<script src="data/works.js"></script>

<script src="data/content.js"></script>

<script src="js/core.js"></script>
<script src="js/markdown.js"></script>

<script src="js/blog.js"></script>
<script src="js/about.js"></script>
<script src="js/project.js"></script>
<script src="js/lightbox.js"></script>

</body>
